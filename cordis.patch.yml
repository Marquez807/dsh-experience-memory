# The dsh-experience-memory bundle patch.
#
# One insert row. Later bundle patches and the user's own profile
# cordis.patch.yml may address this row by id `experience-memory`; a patch
# replaces the whole `config` object rather than merging into it, so restate
# every key you need.
#
# The row's `name` is the package specifier, resolved by the loader from the
# profile's node_modules first and then from $DSH_HOME/profiles/node_modules,
# where the DSH installation maintains one flat symlink per in-box package.
# The plugin imports @deepseek-ai/* directly and never bundles them.

- insert:
    - id: experience-memory
      name: dsh-experience-memory
      config:
        enabled: true
        # Resident layer: the always-on experience digest injected every turn.
        residentMaxRecords: 5
        residentMaxBytes: 1536
        # Core layer: cross-project lessons, injected whether or not the turn
        # mentions them. 0 disables it. They share residentMaxBytes with the
        # resident layer above, so guaranteeing them cannot grow the prompt.
        coreMaxRecords: 2
        # On-demand layer: the ceiling for one memory_recall call.
        recallMaxBytes: 16384
        # Empty means infer the domain from the workspace, most explicit source
        # first: `.dsh/memory.yml`, then `package.json#name`, then the git
        # remote's repository name. If none of those resolve, the domain stays
        # empty and the record is workspace-local only — deliberately not the
        # directory name, which would broadcast one project's habits to every
        # directory that happens to share it.
        defaultDomain: ''
        # Maintenance runs at turn end and never on the retrieval hot path.
        maintenanceBatchSize: 32
        # Consecutive failed outcomes that retire a record. Restated rather than
        # left out because a patch replaces the whole `config` object: relying on
        # the code default here would hide the effective value from this file.
        failStreakLimit: 2
        # Turn harvest: raw material for lessons the model did not think to record. Every
        # row it files is a candidate, so this can never put anything in front of the
        # model — it can only fill the candidate pool. Setting `harvestMaxPerTurn` to 0
        # stops the harvester without touching anything else.
        harvestEnabled: true
        # The two detectors the replay measured as unreliable (broad user-statement, and
        # failure-then-recovery). Off until the precision is worth turning on.
        harvestBroad: false
        harvestMaxPerTurn: 1
        # Ceiling on live candidates, and the age at which an untouched one is retired by
        # the maintenance pass. Candidates were previously never swept at all.
        harvestPoolLimit: 200
        harvestCandidateTtlDays: 14
        # Just-in-time recall: when a tool call touches a file, a symbol or a path that
        # some confirmed record already names, that record is attached to the call itself
        # instead of waiting for the model to think of asking. Two throttles, and neither is a
        # per-turn limit — one was tried and it handed the turn's slot to whatever else matched
        # first, so the lesson never went out. `precallCooldownMinutes` keeps one lesson from
        # coming back too soon; `precallMaxPerSession` counts hints actually delivered and is
        # the hard stop. 0 for `precallEnabled` removes the listener entirely.
        precallEnabled: true
        precallMaxPerSession: 20
        precallCooldownMinutes: 30
        # Counts the tool failures this workspace repeats, so `/memory-gaps` can answer "what
        # keeps going wrong, and does anything in the store cover it". Counting only: nothing
        # counted here is ever injected, and no record is written from it. `failureShapeLimit`
        # bounds the table, because a long-lived workspace mints a new shape whenever an error
        # message changes by a word.
        failureTracking: true
        failureShapeLimit: 200
        # Which agent presets ("modes") get no memory at all, by preset id, e.g. [model-test].
        #
        # Why the switch lives here and not in the mode: a preset cannot switch off a plugin the
        # profile installed — the `disabled` flags in a preset only affect rows that preset
        # declares itself. So "this mode has no memory" can only be decided by the plugin, which
        # reads the preset id out of the session header. Listed modes get: no digest, no record
        # hint, no just-in-time hints, no harvesting, no failure counting, and the memory tools
        # refuse with the reason. Empty by default: every mode has memory unless named here.
        disabledPresets: []
        # Declared anchors are checked against what they would cost before they are stored. One
        # record that declares `tool:pwsh` matched 5,936 of 15,896 recorded calls and owned 94.8% of
        # every hint the store delivered; `path:node_modules` matched 702. Such an anchor is dropped
        # and the caller is told — the record is still written, and still reaches the digest and
        # `memory_recall`. `anchorCostMaxHits` is the same 300 as the pre-registered per-record
        # gate, so one number governs both. The table is a snapshot
        # (`node tools/anchor-cost.mjs --write-table`); when it is absent the check fails open.
        anchorCostTable: true
        anchorCostMaxHits: 300
